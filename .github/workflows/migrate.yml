name: Database migrations

# Manual database tools. Normal migrations need nothing from you: the CI
# workflow applies new supabase/migrations/* automatically on every push to
# the default branch, before deploying the app.
#
# Actions tab > Database migrations > Run workflow:
# - no boxes ticked: read-only status report plus the list of pending
#   migrations (dry run).
# - "apply": apply pending migrations now (CI normally does this).
# - "mark_init_applied": one-off repair for a database where the init SQL
#   was run by hand in the SQL editor; only when the status shows 17 of 17.
#
# Needs repository secret SUPABASE_DB_URL (docs/SETUP.md).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply pending migrations (unticked = dry run)"
        type: boolean
        default: false
      mark_init_applied:
        description: "Init SQL was already run by hand: record it as applied (only if status shows 17 of 17)"
        type: boolean
        default: false

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
      MARK_INIT: ${{ github.event_name == 'workflow_dispatch' && inputs.mark_init_applied }}
    steps:
      - uses: actions/checkout@v4

      # Same checks as CI, so nothing untested reaches the real database.
      - name: Migrations and RLS checks (local Postgres)
        run: ./scripts/test-db.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Check secret
        id: check
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL secret not set; skipping. See docs/SETUP.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The direct host (db.<ref>.supabase.co) is IPv6-only; GitHub runners
          # cannot reach it. The session pooler URI works over IPv4.
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL is the Direct connection string (db.<ref>.supabase.co), which GitHub cannot reach (IPv6 only). In Supabase click Connect > Session pooler, copy that URI (host ends in pooler.supabase.com, user postgres.<ref>), and update the secret. See docs/SETUP.md."
              exit 1 ;;
          esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" asks the GitHub API, which rate-limits shared runners.
          version: 2.118.0

      - if: steps.check.outputs.enabled == 'true'
        name: Database status (read-only)
        run: |
          set -o pipefail
          {
            echo "### Database status"
            echo '```'
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f scripts/db-status.sql 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - if: steps.check.outputs.enabled == 'true' && env.MARK_INIT == 'true'
        name: Record init migration as already applied
        run: |
          # Refuse unless every object from the init migration exists.
          present=$(psql "$SUPABASE_DB_URL" -At -f scripts/db-status.sql | grep -c '|present$' || true)
          if [ "$present" != "17" ]; then
            echo "::error::Only $present of 17 init objects exist, so the init SQL did not fully run. Not marking it applied. Ask Claude how to proceed."
            exit 1
          fi
          supabase migration repair --status applied 20260925000000 --db-url "$SUPABASE_DB_URL"

      - if: steps.check.outputs.enabled == 'true'
        name: Pending migrations (dry run)
        run: |
          set -o pipefail
          {
            echo "### Pending migrations"
            echo '```'
            supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - if: steps.check.outputs.enabled == 'true' && env.APPLY == 'true'
        name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
