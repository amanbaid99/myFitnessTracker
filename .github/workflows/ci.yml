name: CI

# Every push: lint, typecheck, unit tests, build, and migrations plus RLS
# checks on Postgres. When those pass, deploy to Vercel: production for the
# repository's default branch, a preview for any other branch.
#
# Deploy needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID (docs/SETUP.md). Without them the deploy job skips.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: seed.sql matches the parser
        run: pnpm seed:generate --check
      - run: pnpm build
        env:
          # Placeholders: the build only needs these to exist.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and RLS checks
        run: ./scripts/test-db.sh

  deploy:
    needs: [app, database]
    # Push events only: a PR's branch is already deployed by its own push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == github.event.repository.default_branch && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Public Supabase values, from GitHub secrets. Vercel withholds
      # variables marked "Sensitive" from builds made outside Vercel (they
      # arrive as the text [SENSITIVE]), so the build takes them from here.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TARGET: ${{ github.ref_name == github.event.repository.default_branch && 'production' || 'preview' }}
    steps:
      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets not set; skipping deploy. See docs/SETUP.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.check.outputs.enabled == 'true'
        run: npm install --global vercel@60

      # Pulls the project settings and its environment variables (the
      # NEXT_PUBLIC_SUPABASE_* values live in the Vercel project).
      - if: steps.check.outputs.enabled == 'true'
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      # Use the GitHub secrets for the Supabase values, then stop before
      # deploying a build that cannot reach Supabase.
      - if: steps.check.outputs.enabled == 'true'
        name: Supabase settings for the build
        run: |
          file=".vercel/.env.$TARGET.local"
          touch "$file"
          set_var() {
            grep -v "^$1=" "$file" > "$file.tmp" || true
            printf '%s="%s"\n' "$1" "$2" >> "$file.tmp"
            mv "$file.tmp" "$file"
          }
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            set_var NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
            set_var NEXT_PUBLIC_SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
            source="GitHub secrets SUPABASE_URL / SUPABASE_ANON_KEY"
          else
            source="Vercel environment variables"
          fi
          get() { grep -E "^$1=" "$file" | head -1 | cut -d= -f2- | sed -e 's/^[[:space:]"'"'"']*//' -e 's/\\[nr]//g' -e 's/[[:space:]"'"'"']*$//'; }
          url=$(get NEXT_PUBLIC_SUPABASE_URL)
          key=$(get NEXT_PUBLIC_SUPABASE_ANON_KEY)
          echo "Supabase values from: $source"
          echo "URL: ${#url} characters, anon key: ${#key} characters"
          fail() { echo "::error::$1"; exit 1; }
          if [ "$url" = "[SENSITIVE]" ] || [ "$key" = "[SENSITIVE]" ]; then
            fail "Vercel withholds variables marked Sensitive from builds made outside Vercel. Add GitHub secrets SUPABASE_URL and SUPABASE_ANON_KEY (docs/SETUP.md), then re-run this workflow."
          fi
          case "$url" in
            https://*.supabase.co|https://*.supabase.co/) ;;
            *) fail "The Supabase URL from $source is not https://<project-ref>.supabase.co. Fix it, then re-run this workflow." ;;
          esac
          [ -n "$key" ] || fail "The Supabase anon key from $source is empty."

      - if: steps.check.outputs.enabled == 'true'
        run: |
          if [ "$TARGET" = production ]; then PROD=--prod; else PROD=; fi
          vercel build $PROD --token="$VERCEL_TOKEN"

      - if: steps.check.outputs.enabled == 'true'
        id: deploy
        run: |
          if [ "$TARGET" = production ]; then PROD=--prod; else PROD=; fi
          url=$(vercel deploy --prebuilt $PROD --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"
