name: Keep Supabase awake

# Supabase pauses a free-tier project after about a week without activity.
# This calls public.ping() once a day. Carried over from fitnessTracker.
#
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (both
# public values; RLS protects the data). Until they exist the job skips.

on:
  schedule:
    # 06:17 UTC: off the hour, when GitHub drops fewer scheduled runs.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping the database
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL or SUPABASE_ANON_KEY secret not set; skipping."
            exit 0
          fi
          # -f fails the run on 4xx/5xx, so a paused project is noticed.
          curl -sS -f -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -d '{}'
          echo "Supabase pinged."
